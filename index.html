<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h2>💰 Expense Tracker</h2>

        <!-- Balance Summary Box -->
        <div class="balance-box">
            <h4>Your Balance</h4>
            <h1 id="balance">Rs 0.00</h1>
            <div class="inc-exp-container">
                <div class="income">
                    <h4>Income</h4>
                    <p id="money-plus" class="money plus">+Rs 0.00</p>
                </div>
                <div class="expense">
                    <h4>Expense</h4>
                    <p id="money-minus" class="money minus">-Rs 0.00</p>
                </div>
            </div>
        </div>

        <div class="history-section">
            <h3>History</h3>
            <ul id="list" class="list">
            </ul>
        </div>

        <div class="form-section">
            <h3>Add New Transaction</h3>
            <form id="form">
                <div class="form-control">
                    <label for="text">Description</label>
                    <input type="text" id="text" placeholder="Enter text (e.g., Salary, Grocery)..." />
                </div>
                <div class="form-control">
                    <label for="amount">Amount <br><small>(negative - expense, positive - income)</small></label>
                    <input type="number" id="amount" placeholder="Enter amount..." />
                </div>
                <button class="btn">Add Transaction</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
